<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caissa Coach Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Name Screen ── */
    #name-screen {
      position: fixed;
      inset: 0;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .name-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .name-card .logo {
      width: 56px;
      height: 56px;
      background: #1a1a2e;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .name-card h2 {
      font-size: 1.25rem;
      color: #1a1a2e;
      font-weight: 700;
    }

    .name-card p {
      font-size: 0.9rem;
      color: #6b7280;
      line-height: 1.5;
    }

    #coach-name {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
      text-align: center;
    }

    #coach-name:focus { border-color: #4f46e5; }

    #start-btn {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #start-btn:hover { background: #3730a3; }
    #start-btn:disabled { background: #c7c7c7; cursor: not-allowed; }

    /* ── Chat Screen ── */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .header-left h1 { font-size: 1.05rem; font-weight: 600; }
    .header-left p  { font-size: 0.73rem; opacity: 0.6; margin-top: 2px; }

    #greeting {
      font-size: 0.82rem;
      background: rgba(255,255,255,0.12);
      padding: 5px 12px;
      border-radius: 20px;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .message { display: flex; gap: 10px; max-width: 80%; }
    .message.user      { align-self: flex-end;   flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 700; flex-shrink: 0;
    }
    .message.user      .avatar { background: #4f46e5; color: #fff; }
    .message.assistant .avatar { background: #1a1a2e; color: #ffd700; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.92rem;
      white-space: pre-wrap;
    }
    .message.user      .bubble { background: #4f46e5; color: #fff; border-top-right-radius: 4px; }
    .message.assistant .bubble { background: #fff; color: #1a1a2e; border-top-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .typing .bubble { color: #888; font-style: italic; }

    .welcome { text-align: center; color: #6b7280; margin: auto; padding: 32px 16px; }
    .welcome h2 { font-size: 1.2rem; color: #1a1a2e; margin-bottom: 8px; }
    .welcome p  { font-size: 0.88rem; }

    #input-area {
      background: #fff;
      border-top: 1px solid #e2e5ea;
      padding: 14px 16px;
      flex-shrink: 0;
    }

    #input-row {
      display: flex; gap: 10px;
      max-width: 860px; margin: 0 auto;
    }

    #user-input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none; resize: none;
      font-family: inherit;
      max-height: 140px; overflow-y: auto;
      transition: border-color 0.2s;
    }
    #user-input:focus { border-color: #4f46e5; }

    #send-btn {
      background: #4f46e5; color: #fff;
      border: none; border-radius: 50%;
      width: 44px; height: 44px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s;
    }
    #send-btn:hover    { background: #3730a3; }
    #send-btn:disabled { background: #c7c7c7; cursor: not-allowed; }
    #send-btn svg { width: 19px; height: 19px; }
  </style>
</head>
<body>

<!-- ── Name Screen ── -->
<div id="name-screen">
  <div class="name-card">
    <div class="logo">♟</div>
    <h2>Caissa Coach Assistant</h2>
    <p>Your AI-powered knowledge base for SOPs, policies, CRM, scheduling, and more.</p>
    <input type="text" id="coach-name" placeholder="Enter your name to continue" autocomplete="off" />
    <button id="start-btn" disabled>Get Started</button>
  </div>
</div>

<!-- ── Chat Screen ── -->
<div id="chat-screen">
  <header>
    <div class="header-left">
      <h1>Caissa School of Chess</h1>
      <p>Coach Knowledge Assistant</p>
    </div>
    <span id="greeting"></span>
  </header>

  <div id="chat-window">
    <div class="welcome">
      <h2 id="welcome-name"></h2>
      <p>Ask me anything about SOPs, policies, CRM, scheduling, PTMs, and more.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="Ask a question…"></textarea>
      <button id="send-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  let coachName = "";
  let history = [];

  // ── Name screen logic ──
  const nameInput  = document.getElementById("coach-name");
  const startBtn   = document.getElementById("start-btn");

  nameInput.addEventListener("input", () => {
    startBtn.disabled = nameInput.value.trim().length === 0;
  });

  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && nameInput.value.trim()) startSession();
  });

  startBtn.addEventListener("click", startSession);

  function startSession() {
    coachName = nameInput.value.trim();
    if (!coachName) return;
    document.getElementById("name-screen").style.display  = "none";
    document.getElementById("chat-screen").style.display  = "flex";
    document.getElementById("greeting").textContent       = "Hi, " + coachName + " 👋";
    document.getElementById("welcome-name").textContent   = "Welcome, " + coachName + "!";
    document.getElementById("user-input").focus();
  }

  // ── Chat logic ──
  const chatWindow = document.getElementById("chat-window");
  const input      = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");

  function addMessage(role, text) {
    const welcome = chatWindow.querySelector(".welcome");
    if (welcome) welcome.remove();

    const wrap   = document.createElement("div");
    wrap.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? coachName.charAt(0).toUpperCase() : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatWindow.appendChild(wrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);

    const typingWrap = document.createElement("div");
    typingWrap.className = "message assistant typing";
    typingWrap.innerHTML = `<div class="avatar">AI</div><div class="bubble">Thinking…</div>`;
    chatWindow.appendChild(typingWrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history, name: coachName }),
      });

      const data = await res.json();
      typingWrap.remove();

      if (data.error) {
        addMessage("assistant", "Error: " + data.error);
      } else {
        addMessage("assistant", data.reply);
        history.push({ role: "user",      content: text       });
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (e) {
      typingWrap.remove();
      addMessage("assistant", "Network error. Please try again.");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener("click", sendMessage);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
</script>
</body>
</html>
