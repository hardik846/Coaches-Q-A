<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caissa Coach Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header img {
      width: 36px;
      height: 36px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header p {
      font-size: 0.75rem;
      opacity: 0.65;
      margin-top: 2px;
    }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 80%;
    }

    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .message.user .avatar { background: #4f46e5; color: #fff; }
    .message.assistant .avatar { background: #1a1a2e; color: #ffd700; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.92rem;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: #4f46e5;
      color: #fff;
      border-top-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #fff;
      color: #1a1a2e;
      border-top-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .typing .bubble { color: #888; font-style: italic; }

    #input-area {
      background: #fff;
      border-top: 1px solid #e2e5ea;
      padding: 16px;
    }

    #input-row {
      display: flex;
      gap: 10px;
      max-width: 860px;
      margin: 0 auto;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #d1d5db;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      font-family: inherit;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #4f46e5; }

    #send-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #3730a3; }
    #send-btn:disabled { background: #c7c7c7; cursor: not-allowed; }

    #send-btn svg { width: 20px; height: 20px; }

    .welcome {
      text-align: center;
      color: #6b7280;
      margin: auto;
      padding: 32px 16px;
    }

    .welcome h2 { font-size: 1.3rem; color: #1a1a2e; margin-bottom: 8px; }
    .welcome p { font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Caissa School of Chess</h1>
    <p>Coach Knowledge Assistant</p>
  </div>
</header>

<div id="chat-window">
  <div class="welcome">
    <h2>Welcome, Coach!</h2>
    <p>Ask me anything about SOPs, policies, CRM, scheduling, PTMs, and more.</p>
  </div>
</div>

<div id="input-area">
  <div id="input-row">
    <textarea id="user-input" rows="1" placeholder="Ask a question…"></textarea>
    <button id="send-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
  const chatWindow = document.getElementById("chat-window");
  const input = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  let history = [];

  function addMessage(role, text) {
    const welcome = chatWindow.querySelector(".welcome");
    if (welcome) welcome.remove();

    const wrap = document.createElement("div");
    wrap.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "C" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatWindow.appendChild(wrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);

    const typingWrap = document.createElement("div");
    typingWrap.className = "message assistant typing";
    typingWrap.innerHTML = `<div class="avatar">AI</div><div class="bubble">Thinking…</div>`;
    chatWindow.appendChild(typingWrap);
    chatWindow.scrollTop = chatWindow.scrollHeight;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history }),
      });

      const data = await res.json();
      typingWrap.remove();

      if (data.error) {
        addMessage("assistant", "Error: " + data.error);
      } else {
        addMessage("assistant", data.reply);
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (e) {
      typingWrap.remove();
      addMessage("assistant", "Network error. Please try again.");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener("click", sendMessage);

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
</script>
</body>
</html>
